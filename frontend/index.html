<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViaLivre AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>ViaLivre AI</h1>
    <p>Descubra o melhor horário para sair no trânsito</p>
  </header>

  <main>
    <section>
      <h2>Simular trajeto</h2>

      <label for="origem">Origem</label>
      <input type="text" id="origem" placeholder="Ex: São Leopoldo">

      <label for="destino">Destino</label>
      <input type="text" id="destino" placeholder="Ex: Porto Alegre">

      <label for="horario">Horário de saída</label>
      <input type="time" id="horario">

      <label for="clima">Clima</label>
      <select id="clima">
        <option value="limpo">Limpo</option>
        <option value="nublado">Nublado</option>
        <option value="chuva">Chuva</option>
      </select>

      <label for="transporte">Tipo de transporte</label>
      <select id="transporte">
        <option value="carro">Carro</option>
        <option value="moto">Moto</option>
        <option value="onibus">Ônibus</option>
      </select>

      <button onclick="analisar()">Analisar</button>
    </section>

    <section>
      <h2>Resultado</h2>
      <div id="resultado" class="resultado neutro">
        A recomendação aparecerá aqui.
      </div>
    </section>

    <section>
      <h2>Histórico</h2>
      <button class="btn-limpar" onclick="limparHistorico()">Limpar histórico</button>
      <ul id="lista"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
